<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — Digital Library Management System</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/common.css">
</head>
<body class="auth-page">

  <div class="auth-card" style="max-width: 480px;">
    <div class="auth-header">
      <a href="/" class="auth-brand">
        <i class="bi bi-book-half"></i>
        <span>LibSphere</span>
      </a>
      <p class="auth-subtitle">Join the digital library platform</p>
    </div>

    <div id="register-alert" style="display: none; padding: 0.75rem 1rem; border-radius: 8px; margin-bottom: 1.25rem; font-size: 0.85rem;" class="badge-danger"></div>

    <form id="register-form">
      <div class="form-group">
        <label for="name" class="form-label">Full Name *</label>
        <input type="text" id="name" class="form-control" placeholder="e.g. Maya Patel" minlength="2" maxlength="120" required autofocus>
      </div>

      <div class="form-group">
        <label for="email" class="form-label">Email Address *</label>
        <input type="email" id="email" class="form-control" placeholder="maya@example.com" required>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password *</label>
        <input type="password" id="password" class="form-control" placeholder="At least 6 characters" minlength="6" maxlength="100" required>
        <div class="form-text">Must be at least 6 characters.</div>
      </div>

      <div class="form-group">
        <label for="phone" class="form-label">Phone Number</label>
        <input type="tel" id="phone" class="form-control" placeholder="e.g. 9876543210" maxlength="20">
      </div>

      <div class="form-group">
        <label for="address" class="form-label">Address / Department</label>
        <textarea id="address" class="form-control" rows="2" placeholder="e.g. Room 302, Hostel B or City, State"></textarea>
      </div>

      <button type="submit" id="register-btn" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 0.5rem;">
        <i class="bi bi-person-plus-fill"></i> Create Account
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.75rem; font-size: 0.875rem; color: var(--color-text-muted);">
      Already have an account? <a href="/login.html" style="font-weight: 600;">Sign In</a>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById('register-alert');
      alertBox.style.display = 'none';

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const phone = document.getElementById('phone').value.trim() || null;
      const address = document.getElementById('address').value.trim() || null;
      const btn = document.getElementById('register-btn');

      setButtonLoading(btn, true);

      try {
        await apiFetch('/api/auth/register', {
          method: 'POST',
          body: JSON.stringify({ name, email, password, phone, address })
        });

        showToast('Account created successfully! Please sign in.', 'success');
        setTimeout(() => {
          window.location.href = `/login.html?registered=true`;
        }, 1200);
      } catch (err) {
        let msg = err.message || 'Registration failed';
        if (err.data && err.data.fieldErrors && err.data.fieldErrors.length > 0) {
          msg = err.data.fieldErrors.map(f => `${f.field}: ${f.message}`).join(', ');
        }
        alertBox.textContent = msg;
        alertBox.style.display = 'block';
        setButtonLoading(btn, false, '<i class="bi bi-person-plus-fill"></i> Create Account');
      }
    });
  </script>
</body>
</html>
